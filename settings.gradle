pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // 固定 fork 只读取本项目生成的 Maven 产物，避免命中开发机旧包或回落到上游。
        // 首次构建运行 python scripts/prepare-ui-forks.py，CI 由公共 action 执行。
        exclusiveContent {
            forRepository {
                maven {
                    name = 'pinnedUiForks'
                    url = uri(file('build/ui-forks/maven'))
                }
            }
            filter {
                includeModule('io.github.feice11', 'mochi-compose')
                includeModule('io.github.feice11', 'mochi-ios')
                includeModule('io.github.itoseo', 'coui')
                includeModule('io.github.itoseo', 'coui-material3')
                includeModule('io.github.itoseo', 'coui-icons')
            }
        }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()
    }
    // eink 模块自有版本目录（保守档钉版，文件随模块树走）——
    // 模块库依赖经 einkLibs.* 引用，与宿主根目录 libs 解耦；
    // 模块经 git 子模块集成（eink-lib/ 目录，eink/lib 独立分支），
    // 移植形态见 eink-lib/modules/eink 内 contract/EINK-PORTING.md §2
    versionCatalogs {
        einkLibs {
            from(files('eink-lib/modules/eink/gradle/libs.versions.toml'))
        }
    }
}
rootProject.name = 'legado'

// Build the pinned Miuix snapshot without GitHub Packages credentials.
if (!file('modules/miuix/settings.gradle.kts').isFile()) {
    throw new GradleException('Initialize Miuix with git submodule update --init modules/miuix')
}
includeBuild('modules/miuix')

include ':app'
include ':modules:book'
include ':modules:rhino'
include ':modules:eink'
project(':modules:eink').projectDir = file('eink-lib/modules/eink')
include ':baselineprofile'
project(':baselineprofile').projectDir = file('baselineProfile')
