name: Verify

on:
  push:
    branches:
      - main
      - master
      # 当前开发/发布主线（eink 移植轮），直推也跑验证
      - eink/port/md3/modules
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 按变体分组：core / full 各跑一个 runner，避免同一 runner 上两个变体的 Kotlin 编译
  # 互相争内存（OutOfMemoryError: Java heap space）。
  # 墨本只发布 appCore（appFull 的漫画本地推理栈与墨水屏定位无关），此处只验证 Core。
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: Core
            label: core
    name: Verify (${{ matrix.label }})
    runs-on: ubuntu-latest
    # 打包段曾在 CI 挂死 4~6 小时（GitHub 6h 上限才杀）；45 分钟足以覆盖
    # 正常 16~23 分钟的完整验证，超时即失败并保留当时日志。
    timeout-minutes: 45
    # concurrency 放在 job 层：workflow 层的 concurrency 不保证能解析 matrix 上下文。
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-${{ matrix.product }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # eink 模块经 git 子模块集成（eink/lib 分支）
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 auto-release.yml 同一处理：settings.gradle 里的 aliyun 镜像面向国内开发机，
      # 在 GitHub runner 上会 502，且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      # 测试/lint/架构检查/AndroidTest 编译先行；--stacktrace 保证失败时输出完整异常链
      #（曾出现 packageAppDebug 内层异常 message 为空、日志无因可查）。
      # Reader semantic golden/contract/consumer/file tests are discovered by the
      # same unfiltered JVM task, preserving per-class Robolectric isolation.
      - name: Run tests, lint, architecture check, and androidTest compile
        run: |
          chmod +x gradlew
          ./gradlew \
            testApp${{ matrix.product }}DebugUnitTest \
            lintApp${{ matrix.product }}Debug \
            verifyConfigArchitecture \
            compileApp${{ matrix.product }}DebugAndroidTestKotlin \
            --continue \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache

      # 打包单独成步、不与测试/lint 并发：2026-10 起 CI 上 mergeProjectDex→
      # packageAppDebug（ABI 拆分打包）两次挂死、一次空 message 崩溃，而同
      # commit 无并发负载的打包（Auto Build 与 Verify 重跑）均绿。错峰隔离
      # 是目前唯一可观察的有效差异；--stacktrace 保留真因，超时由 job 级
      # timeout-minutes 兜底。
      - name: Package debug APK (isolated from tests)
        run: |
          ./gradlew \
            assembleApp${{ matrix.product }}Debug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/build/test-results/testApp${{ matrix.product }}DebugUnitTest/**
            app/build/reports/tests/testApp${{ matrix.product }}DebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-app${{ matrix.product }}Debug.html
            app/build/reports/lint-results-app${{ matrix.product }}Debug.xml
            app/build/reports/lint-results-app${{ matrix.product }}Debug.txt
            app/build/reports/lint-results-app${{ matrix.product }}Debug.sarif
