# ============================================================================
# eink 模块自有版本目录（根 settings 经 versionCatalogs 以「einkLibs」挂载，
# 文件随模块树整体复制）。本文件是模块全部库依赖版本的唯一权威：改任何
# 版本前先读完这份注释，再按 EINK-PORTING.md §0 整体重验门槛。
# ============================================================================
#
# ── 为什么钉「保守档」（不要随手升级）────────────────────────────────
# 单一坐标服务新旧宿主：模块按最低公共依赖集编译，POM 随保守版发布；
# 新栈宿主解析时自动升到自己的更高版本（Gradle 取 max，二进制兼容）——
# 本仓 app（BOM 2026.08.00 / Coil 3.6.2 / lifecycle 2.11）即此形态。
# 升级本文件版本不会给新栈宿主带来任何收益（他们本来就用更新的），
# 只会抬高一档旧宿主的消费门槛——这就是「错误升级」的代价。
#
# 消费门槛四条（宿主须全部满足；来源＝模块 AAR 元数据＋依赖元数据＋构建栈）：
#   compileSdk ≥ 35 ＝ 依赖集硬地板：compose ui/foundation 1.9.4 与
#                     core 1.15 的 AAR 元数据 minCompileSdk 实测均 35
#                     → 对应 AGP ≥ 8.6.0；模块 compileSdk 同值（build.gradle）
#   Kotlin   ≥ 2.3  ＝ 模块以 K2.4 构建，元数据一版本前向可读
#   Java 字节码 17  ＝ 宿主 D8 消解
#   minSdk   ≥ 21   ＝ 依赖集下限（Coil 3.0.4 档）
#
# ── 家族事实（2026-09-19 调研 legado.erchuang.online 索引，22 个 Android 仓）──
# legado 原生家族地板：AGP 8.13.2 / compileSdk 36 / Kotlin 2.3.0 / minSdk 21
# （AGP 8.13.2 × 17、9.x × 3；compileSdk 36 × 18、37 × 3；Kotlin 2.3.x × 17、
#   2.4 × 2；minSdk 21 × 13。）当前门槛对原生家族 100% 覆盖。
# ⚠ 最贴地的是 Kotlin ≥ 2.3：家族最低恰为 2.3.0，零余量——主栈 Kotlin
#   一旦以 2.5+ 构建发布，17 个 2.3 宿主即出局（只剩 2.4 两仓）。
# ⚠ compileSdk 35 与 36 对已知宿主零差异（全家族 ≥36）：35 是依赖集硬
#   地板，给家族外宿主留余量，勿降勿升。
#
# ── 升档协议（确需使用更新依赖能力时）───────────────────────────────
# 1) 改本文件版本；2) 重测四条门槛——重点查新依赖 AAR 元数据的
#    minCompileSdk 与 minSdk 声明；3) 同步 build.gradle 的 compileSdk 与
#    PORTING §0 表格；4) minor 升版本号破契发布，发版日志写明新门槛；
# 5) 真机回归（含 minSdk 低档设备）。
# 插件版本不在此目录（构建栈属性，沿用宿主根目录插件别名，版本随目标仓）。

[versions]
# compose 1.9.4 线＝minCompileSdk 35 地板来源；1.10+/1.11/1.12 线依次抬门槛
composeBom = "2025.11.00"
# Coil 3.5+ 声明 minSdk 23（踢出 Android 5.x 设备宿主）——升前必查
coil = "3.0.4"
# 家族旧栈实测可消费档
lifecycle = "2.8.7"
activity = "1.8.2"
appcompat = "1.7.0"
# 纯 JVM 件，无 Android 门槛，跟随主仓
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
# Compose artifacts 走 BOM 平台约束（versionless），发布 POM 记录解析后的具体版本
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
junit = { module = "junit:junit", version.ref = "junit" }
